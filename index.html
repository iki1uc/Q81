<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>RESPO · 81.tmp · AXD</title>

    <style>
        body {
            background:#000;
            color:#eee;
            font-family:Consolas, monospace;
            padding:20px;

        h1 { color:#6cf; }
        pre {
            background:#111;
            padding:15px;

<body>

<h1>RESPO · 81.tmp · AXD</h1>

<script type="module">

    import { _81tmp_matrix } from "./JS/81tmp.matrix.js";
    import { Z_Axis } from "./JS/Z.axis.js";

    async function start() {

        const atom = {
            Elektron: 3,
            Proton: 2,
            Neutron: 1,
            Orbit: 4
        };

        document.body.innerHTML += "<pre>Z‑Axis:\n" +
            JSON.stringify(Z_Axis(atom), null, 2) +
            "</pre>";

        const matrix = await _81tmp_matrix();
        document.body.innerHTML += "<pre>81tmp‑Matrix:\n" +
            JSON.stringify(matrix, null, 2) +
            "</pre>";
    }

    start();

</script>

</body>
