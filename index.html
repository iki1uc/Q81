<body>
<h1>Q81 · ID‑Viewer.html · Viewer</h1>

<script type="module">

import { RESPO_ID } from "./JS/RESPO_AXD.tmp";
import { ID_VIEW } from "./JS/ID.viewer.js";
import { ID_ENGINE } from "./JS/ID.engine.js";

const Mond  = { x:1, y:2, z:0 };
const Erde  = { x:4, y:3, z:1 };
const Sonne = { x:10, y:8, z:5 };

const respo = RESPO_ID(3, "HH", Mond, Erde, Sonne);

document.body.innerHTML += "<pre>" + ID_VIEW(respo) + "</pre>";

document.body.innerHTML += "<pre>KOOP-ID:\n" +
    ID_ENGINE("koop", respo) + "</pre>";

document.body.innerHTML += "<pre>NEUTRAL-ID:\n" +
    ID_ENGINE("neutral", respo) + "</pre>";

document.body.innerHTML += "<pre>POOK-ID:\n" +
    ID_ENGINE("pook", respo) + "</pre>";

</script>
